spring.application.name=digital-addiction-monitor-backend-test

# In-memory H2 with a per-context-load random DB name -- never touches the
# dev DB file at backend/data/damdb.mv.db, and avoids @DataJpaTest and
# @SpringBootTest contexts (which don't share a Spring context cache key)
# from colliding on the same named in-memory database within one test JVM.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

ml-service.base-url=http://localhost:0
ml-service.timeout-ms=1000
