spring.application.name=digital-addiction-monitor-backend
server.port=${PORT:8080}

# File-based H2 so uploaded logs survive a restart, unlike an in-memory DB.
spring.datasource.url=jdbc:h2:file:./data/damdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Base URL of the Python FastAPI ml-service (see ../ml-service). Overridable
# via env var so a deployed backend can point at a different ml-service host
# without a code change.
ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml-service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:5000}
